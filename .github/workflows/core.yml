name: Protea Core

on:
  push:
    branches: [main]
    paths: ["core/**", ".github/workflows/core.yml"]
  pull_request:
    paths: ["core/**", ".github/workflows/core.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: CLI persistence smoke test
        run: |
          STATE="$(mktemp)"
          PROTEA_STATE_FILE="$STATE" cargo run -q -p protea-core-cli -- status
          PROTEA_STATE_FILE="$STATE" cargo run -q -p protea-core-cli -- gaming
          test "$(PROTEA_STATE_FILE="$STATE" cargo run -q -p protea-core-cli -- status | grep "^mode:" | tr -d "\r")" = "mode: Gaming"
          rm -f "$STATE"
