name: Protea PC Image

on:
  push:
    branches: [main]
    paths:
      - "build/**"
      - "core/**"
      - "pc/**"
      - ".github/workflows/pc-image.yml"
  pull_request:
    paths:
      - "build/**"
      - ".github/workflows/pc-image.yml"

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache Buildroot source
        uses: actions/cache@v4
        with:
          path: .cache
          key: protea-buildroot-2025.02.18

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex cpio file rsync unzip wget curl             python3 libncurses-dev qemu-system-x86

      - name: Build Buildroot PC image
        run: |
          chmod +x build/fetch-buildroot.sh build/build-pc.sh build/prepare-pc-overlay.sh build/qemu/run-console.sh
          ./build/build-pc.sh

      - name: Verify expected image artifacts
        run: |
          test -s output/pc/images/bzImage
          test -s output/pc/images/rootfs.ext2
          test -s output/pc/images/rootfs.iso9660
          file output/pc/images/bzImage output/pc/images/rootfs.ext2 output/pc/images/rootfs.iso9660

      - name: Boot image in QEMU
        run: |
          chmod +x build/qemu/run-console.sh
          timeout 45s build/qemu/run-console.sh > qemu-boot.log 2>&1 || code=$?
          code="${code:-0}"
          cat qemu-boot.log
          if grep -q "PROTEA_BOOT_OK" qemu-boot.log; then
            echo "QEMU boot reached Protea system readiness."
          elif grep -q "Welcome to Buildroot" qemu-boot.log; then
            echo "QEMU boot reached the Buildroot userspace, but Protea readiness marker was not observed."
            exit 1
          elif [ "$code" -eq 124 ]; then
            echo "QEMU did not exit before timeout; inspect the boot log."
            exit 1
          else
            echo "QEMU boot did not reach the expected userspace marker."
            exit 1
          fi

      - name: Boot installation ISO in QEMU
        run: |
          timeout 45s qemu-system-x86_64 \
            -m 1024 -smp 2 \
            -cdrom output/pc/images/rootfs.iso9660 \
            -device virtio-gpu-pci \
            -netdev user,id=net0 -device virtio-net-pci,netdev=net0 \
            -nographic > qemu-iso-boot.log 2>&1 || code=$?
          code="${code:-0}"
          cat qemu-iso-boot.log
          if grep -q "PROTEA_BOOT_OK" qemu-iso-boot.log; then
            echo "Protea ISO boot reached system readiness."
          elif [ "$code" -eq 124 ]; then
            echo "Protea ISO did not reach system readiness before timeout."
            exit 1
          else
            echo "Protea ISO boot failed."
            exit 1
          fi

      - name: Upload QEMU boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protea-qemu-boot-log
          path: qemu-boot.log
