name: Protea PC Image

on:
  push:
    branches: [main, "fix/**"]
    paths:
      - "build/**"
      - "core/**"
      - "pc/**"
      - ".github/workflows/pc-image.yml"
  pull_request:
    paths:
      - "build/**"
      - ".github/workflows/pc-image.yml"
  workflow_dispatch:

concurrency:
  group: protea-pc-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          echo "Disk usage before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL "${AGENT_TOOLSDIRECTORY:-}" \
            /usr/local/.ghcup /opt/az /usr/local/share/powershell \
            /usr/share/swift /usr/local/julia* /usr/local/share/boost \
            2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          echo "Disk usage after cleanup:"
          df -h /

      - name: Cache Buildroot source
        uses: actions/cache@v4
        with:
          path: .cache
          key: protea-buildroot-2025.02.18

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex cpio file rsync unzip wget curl python3 libncurses-dev qemu-system-x86 xorriso e2fsprogs

      - uses: dtolnay/rust-toolchain@stable

      - name: Build Buildroot PC image
        run: |
          chmod +x build/fetch-buildroot.sh build/build-pc.sh build/prepare-pc-overlay.sh build/qemu/run-console.sh build/validate-pc-image.sh
          ./build/build-pc.sh

      # TEMPORARY DIAGNOSTIC: protea-desktop has been segfaulting inside
      # libcairo.so.2.11804.4 at the exact same ELF file offset (0x69bf8)
      # across every configuration tried locally, but no local machine
      # here has the RAM to download the ~650MB image artifact and
      # disassemble it (repeatedly killed by low-memory protection).
      # The runner building the image already has the real binary right
      # here, unstripped, with plenty of RAM/disk - resolve the crashing
      # function directly instead of guessing further. Remove once the
      # real cause is found and fixed.
      - name: DIAGNOSTIC - resolve libcairo.so crash offset to a symbol
        run: |
          echo "Looking for libcairo.so copies under output/pc ..."
          find output/pc -iname 'libcairo.so*' -exec file {} \;
          echo "---"
          resolve() {
            local lib="$1" label="$2"
            # Full symbol table (.symtab, includes internal/static
            # functions like cairo's many _cairo_* helpers) if present on
            # an unstripped copy; dynamic-only (-D, exported symbols only)
            # as a fallback for a stripped target copy, which would only
            # resolve to the nearest PUBLIC cairo_* API function.
            local syms
            syms=$(nm --defined-only "$lib" 2>/dev/null | awk '$2 ~ /[TtWw]/ {print $1, $3}')
            if [ -z "$syms" ]; then
              syms=$(nm -D --defined-only "$lib" 2>/dev/null | awk '$2 ~ /[TtWw]/ {print $1, $3}')
              label="$label (dynamic/exported symbols only - may be imprecise)"
            fi
            if [ -z "$syms" ]; then
              echo "  [$label] no symbols at all (fully stripped)"
              return
            fi
            echo "$syms" | sort | awk -v target=0x69bf8 -v label="$label" '
              BEGIN { t = strtonum(target); best_addr=0; best_name="(before first symbol)" }
              { addr = strtonum("0x" $1); if (addr <= t && addr >= best_addr) { best_addr = addr; best_name = $2 } }
              END { printf "  [%s] target %s likely falls inside: %s (symbol at 0x%x, +0x%x into it)\n", label, target, best_name, best_addr, (t - best_addr) }
            '
          }
          for lib in $(find output/pc -iname 'libcairo.so*' -type f); do
            echo "=== $lib ==="
            resolve "$lib" "$lib"
          done
          echo "--- full address-sorted symbol table (first match file), for manual cross-check ---"
          FIRST_LIB=$(find output/pc -iname 'libcairo.so*' -type f | head -1)
          if [ -n "$FIRST_LIB" ]; then
            nm -D --defined-only "$FIRST_LIB" 2>/dev/null | awk '$2 ~ /[TtWw]/ {print $1, $3}' | sort | grep -A3 -B3 -i "^00000000000697\|^00000000000698\|^00000000000699\|^0000000000069a" || echo "(no symbols within ~0x100 of the target either way)"
          fi

      - name: Verify expected image artifacts
        run: |
          test -s output/pc/images/bzImage
          test -s output/pc/images/rootfs.ext2
          test -s output/pc/images/rootfs.iso9660
          file output/pc/images/bzImage output/pc/images/rootfs.ext2 output/pc/images/rootfs.iso9660
          xorriso -indev output/pc/images/rootfs.iso9660 -find / -type f 2>&1 | tee iso-file-list.txt
          grep -E 'bzImage' iso-file-list.txt
          grep -E '(rootfs.*cpio|initrd)' iso-file-list.txt

      - name: Validate built PC image
        run: ./build/validate-pc-image.sh

      - name: Boot PC image in QEMU
        run: |
          set +e
          timeout 90s build/qemu/run-console.sh > qemu-boot.log 2>&1
          code=$?
          set -e
          cat qemu-boot.log
          # The console log has ANSI colour codes embedded INSIDE keywords
          # (e.g. "Gtk-<esc>[1;33mWARNING<esc>[0m"), so a plain grep for
          # "Gtk-WARNING" never matches - strip them first so pattern
          # matching below actually works.
          sed -r 's/\x1b\[[0-9;]*m//g' qemu-boot.log > qemu-boot.clean.log
          CRASH_PATTERN='reported baselines|g_object_ref: assertion|Unable to create Cairo image surface|segfault|Segmentation fault|protea-desktop.*panicked|Failed to open display'
          if grep -q "PROTEA_BOOT_OK" qemu-boot.clean.log; then
            echo "QEMU PC image boot reached Protea system readiness."
            if grep -q "PROTEA_GRAPHICS_OK" qemu-boot.clean.log; then
              if grep -Eqi "$CRASH_PATTERN" qemu-boot.clean.log; then
                echo "Weston started but protea-desktop crashed or failed to render - see qemu-boot.log."
                exit 1
              fi
              if ! grep -q "PROTEA_DESKTOP_WINDOW_PRESENTED" qemu-boot.clean.log; then
                echo "Weston started but protea-desktop never reported its window as presented - see qemu-boot.log."
                exit 1
              fi
              echo "Protea graphical session (Weston + protea-desktop) started and presented its window."
            else
              echo "Boot succeeded but the graphical session did not start - see qemu-boot.log."
              exit 1
            fi
          elif grep -Eqi "Kernel panic|VFS: Unable to mount root fs|cannot mount root" qemu-boot.clean.log; then
            echo "PC image kernel/root filesystem failure detected."
            exit 1
          elif [ "$code" -eq 124 ]; then
            echo "PC image boot timed out before readiness."
            exit 1
          else
            echo "PC image boot did not reach the expected readiness marker (exit $code)."
            exit 1
          fi

      - name: Boot installation ISO in QEMU
        run: |
          set +e
          KVM_FLAGS=()
          if [ -w /dev/kvm ]; then
            KVM_FLAGS=(-enable-kvm -cpu host)
          fi
          timeout 90s qemu-system-x86_64 \
            -m 1024 -smp 2 \
            "${KVM_FLAGS[@]}" \
            -cdrom output/pc/images/rootfs.iso9660 \
            -boot order=d \
            -device virtio-gpu-pci \
            -netdev user,id=net0 -device virtio-net-pci,netdev=net0 \
            -nographic > qemu-iso-boot.log 2>&1
          code=$?
          set -e
          cat qemu-iso-boot.log
          sed -r 's/\x1b\[[0-9;]*m//g' qemu-iso-boot.log > qemu-iso-boot.clean.log
          CRASH_PATTERN='reported baselines|g_object_ref: assertion|Unable to create Cairo image surface|segfault|Segmentation fault|protea-desktop.*panicked|Failed to open display'
          if grep -q "PROTEA_BOOT_OK" qemu-iso-boot.clean.log; then
            if grep -q "PROTEA_GRAPHICS_OK" qemu-iso-boot.clean.log && grep -Eqi "$CRASH_PATTERN" qemu-iso-boot.clean.log; then
              echo "ISO boot reached readiness but protea-desktop crashed or failed to render - see qemu-iso-boot.log."
              exit 1
            fi
            echo "Protea ISO boot reached system readiness."
          elif grep -Eqi "file .* not found|grub rescue|grub>" qemu-iso-boot.clean.log; then
            echo "ISO bootloader/configuration failure detected."
            exit 1
          elif grep -Eqi "Kernel panic|VFS: Unable to mount root fs|Cannot open root device" qemu-iso-boot.clean.log; then
            echo "ISO kernel/root filesystem failure detected."
            exit 1
          elif [ "$code" -eq 124 ]; then
            echo "Protea ISO did not reach system readiness before timeout."
            exit 1
          else
            echo "Protea ISO boot failed before readiness (exit $code)."
            exit 1
          fi

      # Upload generated images even when a boot test fails, so the failed
      # ISO can be downloaded and inspected. Missing files are not hidden.
      - name: Upload built images for diagnosis
        if: ${{ always() && steps.build.outcome != 'failure' && (hashFiles('output/pc/images/rootfs.iso9660') != '' || hashFiles('output/pc/images/rootfs.ext2') != '') }}
        uses: actions/upload-artifact@v4
        with:
          name: protea-pc-images-${{ github.run_number }}
          path: |
            output/pc/images/rootfs.iso9660
            output/pc/images/bzImage
            output/pc/images/rootfs.ext2
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14

      - name: Upload QEMU and ISO diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protea-boot-diagnostics-${{ github.run_number }}
          path: |
            qemu-boot.log
            qemu-boot.clean.log
            qemu-iso-boot.log
            qemu-iso-boot.clean.log
            iso-file-list.txt
          if-no-files-found: warn
          retention-days: 14
