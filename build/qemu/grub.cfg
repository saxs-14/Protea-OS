set default=0
set timeout=1

set menu_color_normal=white/black
set menu_color_highlight=yellow/dark-gray

# Buildroot substitutes these placeholders with the kernel and initramfs
# paths that it actually installs into the ISO. Do not assume fixed filenames.
menuentry "Protea OS - AFRICAN ROOTS. DIGITAL FUTURE." {
    linux __KERNEL_PATH__ console=ttyS0 rdinit=/sbin/init
    initrd __INITRD_PATH__
}
